<style>
/* ── Design tokens ─────────────────────────────────────────────────── */
:root {
  --bg:        #0b0c0f;
  --surface:   #13151a;
  --surface2:  #1c1f27;
  --border:    #2a2d38;
  --border2:   #363a4a;

/* ── Reset ─────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* Set bg on html too — so html::before/after pseudo-elements render on the dark bg */
html {
  background: var(--bg);
  min-height: 100%;
}

body {
  font-family: var(--display);
  background: transparent;
  color: var(--text);
  min-height: 100vh;
  padding: 32px 24px 60px;
  position: relative;
  z-index: 1;
  overflow-x: hidden;
}

/* Grid bg texture — on html so jsPDF's body-injected iframes never cover it */
html::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(212,245,66,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(212,245,66,.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}

/* Glow blob — on html for same reason */
html::after {
  content: '';
  position: fixed;
  top: -200px; left: 50%;
  transform: translateX(-50%);
  width: 700px; height: 500px;
  background: radial-gradient(ellipse, rgba(212,245,66,.08) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

/* Suppress any iframes/canvases jsPDF silently injects into body */
body > iframe {
  position: fixed !important;
  top: -9999px !important; left: -9999px !important;
  width: 1px !important; height: 1px !important;
  opacity: 0 !important; pointer-events: none !important;

body > canvas { display: none !important; }

.wrap {

  max-width: 820px;

}

/* ── Header ────────────────────────────────────────────────────────── */
header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;

<script>
/* ══════════════════════════════════════════════════════════════
   STATE
══════════════════════════════════════════════════════════════ */
const fileInput   = document.getElementById('fileInput');
const listEl      = document.getElementById('list');
const toolbar     = document.getElementById('toolbar');
const fileCountEl = document.getElementById('fileCount');
const toastEl     = document.getElementById('toast');
const dropzone    = document.getElementById('dropzone');

let files = [];
let uid = 0;

const imgTypes = ['png','jpg','jpeg','webp'];

/* ══════════════════════════════════════════════════════════════
   HELPERS
══════════════════════════════════════════════════════════════ */
function ext(name){ return name.split('.').pop().toLowerCase(); }

function fmtSize(bytes){
  if(bytes < 1024) return bytes + ' B';
  if(bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/1024/1024).toFixed(1) + ' MB';
}

function getOptions(filename){
  const e = ext(filename);
  if(imgTypes.includes(e)) return ['jpg','png','webp','pdf','base64'];
  if(e === 'pdf')          return ['docx','base64'];
  if(e === 'docx')         return ['pdf','base64'];
  return ['base64'];
}

function defaultTarget(filename){ return getOptions(filename)[0]; }

/* Toast */
let toastTimer;
function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> toastEl.classList.remove('show'), 2800);
}

/* ══════════════════════════════════════════════════════════════
   DRAG & DROP
══════════════════════════════════════════════════════════════ */
dropzone.addEventListener('dragover', e=>{
  e.preventDefault();
  dropzone.classList.add('drag-over');
});
dropzone.addEventListener('dragleave', ()=> dropzone.classList.remove('drag-over'));
dropzone.addEventListener('drop', e=>{
  e.preventDefault();
  dropzone.classList.remove('drag-over');
  addFiles([...e.dataTransfer.files]);
});

/* ══════════════════════════════════════════════════════════════
   UPLOAD
══════════════════════════════════════════════════════════════ */
fileInput.addEventListener('change', e=>{
  addFiles([...e.target.files]);
  fileInput.value = '';
});

function addFiles(newFiles){
  newFiles.forEach(file=>{
    files.push({
      id: ++uid,
      file,
      target: defaultTarget(file.name),
      status: 'ready',
      result: null,
      quality: 0.9,
      thumbUrl: imgTypes.includes(ext(file.name)) ? URL.createObjectURL(file) : null
    });
  });
  render();
}

/* ══════════════════════════════════════════════════════════════
   RENDER  — only updates changed cards, no full re-render
══════════════════════════════════════════════════════════════ */
function render(){
  // Sync toolbar visibility & count
  if(files.length > 0){
    toolbar.style.display = 'flex';
    fileCountEl.textContent = files.length + ' file' + (files.length===1?'':'s');
  } else {
    toolbar.style.display = 'none';
  }

  // Remove cards for files that no longer exist
  [...listEl.querySelectorAll('.card')].forEach(card=>{
    if(!files.find(f=>f.id === +card.dataset.id)) card.remove();
  });

  // Insert or update each file card
  files.forEach((f, i)=>{
    let card = listEl.querySelector(`[data-id="${f.id}"]`);
    if(!card){
      card = buildCard(f);
      // Insert in order
      const next = listEl.querySelectorAll('.card')[i];
      listEl.insertBefore(card, next || null);
    } else {
      updateCard(card, f);
    }
  });
}

function buildCard(f){
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.id = f.id;
  card.innerHTML = cardHTML(f);
  return card;
}

function cardHTML(f){
  const isImg = imgTypes.includes(ext(f.file.name));
  const opts  = getOptions(f.file.name);

  const thumbHtml = f.thumbUrl
    ? `<img class="card-thumb" src="${f.thumbUrl}" alt="">`
    : `<div class="file-icon">
        <div class="file-icon-glyph">${ext(f.file.name)==='pdf'?'📄':'📝'}</div>
        <div class="file-icon-ext">${ext(f.file.name)}</div>
       </div>`;

  const optionsHtml = opts.map(o=>
    `<option value="${o}" ${f.target===o?'selected':''}>${o.toUpperCase()}</option>`
  ).join('');

  const qualityHtml = isImg ? `
    <div class="quality-row">
      <span class="convert-label">Quality</span>
      <div class="quality-track">
        <input type="range" min="0.1" max="1" step="0.05"
          value="${f.quality}"
          oninput="setQuality(${f.id},this.value)">
      </div>
      <span class="quality-val" id="qval-${f.id}">${Math.round(f.quality*100)}%</span>
    </div>` : '';

  const { pillClass, pillLabel } = statusMeta(f.status);

  const progressHtml = f.status==='converting' ? `
    <div class="progress-bar-wrap"><div class="progress-bar"></div></div>` : '';

  const downloadBtn = f.status==='done'
    ? `<button class="btn btn-download btn-sm" onclick="downloadOne(${f.id})">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download
       </button>` : '';

  return `
    <div class="card-thumb-col">${thumbHtml}</div>
    <div class="card-body">
      <div class="card-top">
        <div>
          <div class="card-name">${escHtml(f.file.name)}</div>
          <div class="card-meta">${fmtSize(f.file.size)}</div>
        </div>
        <div class="status-pill ${pillClass}">
          <div class="pill-dot"></div>${pillLabel}
        </div>
      </div>
      ${progressHtml}
      <div class="card-controls">
        <span class="convert-label">To</span>
        <select onchange="setFormat(${f.id},this.value)">${optionsHtml}</select>
        <span class="arrow-badge" id="badge-${f.id}">
          ${ext(f.file.name).toUpperCase()} → ${f.target.toUpperCase()}
        </span>
      </div>
      ${qualityHtml}
      <div class="card-actions">
        <button class="btn btn-ghost btn-sm" onclick="convertOne(${f.id})" ${f.status==='converting'?'disabled':''}>
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          Convert
        </button>
        ${downloadBtn}
        <button class="btn btn-danger btn-sm" onclick="removeFile(${f.id})">✕ Remove</button>
      </div>
    </div>`;
}

function updateCard(card, f){
  const { pillClass, pillLabel } = statusMeta(f.status);

  // Update class
  card.className = 'card' + (f.status==='done'?' status-done':f.status==='error'?' status-error':'');

  // Status pill
  const pill = card.querySelector('.status-pill');
  if(pill){
    pill.className = `status-pill ${pillClass}`;
    pill.innerHTML = `<div class="pill-dot"></div>${pillLabel}`;
  }

  // Progress bar
  let prog = card.querySelector('.progress-bar-wrap');
  if(f.status==='converting' && !prog){
    const body = card.querySelector('.card-body');
    const top = card.querySelector('.card-top');
    prog = document.createElement('div');
    prog.className = 'progress-bar-wrap';
    prog.innerHTML = '<div class="progress-bar"></div>';
    top.after(prog);
  } else if(f.status!=='converting' && prog){
    prog.remove();
  }

  // Download button
  const actions = card.querySelector('.card-actions');
  if(actions){
    let dlBtn = actions.querySelector('.btn-download');
    if(f.status==='done' && !dlBtn){
      dlBtn = document.createElement('button');
      dlBtn.className = 'btn btn-download btn-sm';
      dlBtn.innerHTML = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Download`;
      dlBtn.onclick = ()=> downloadOne(f.id);
      actions.querySelector('.btn-danger').before(dlBtn);
    } else if(f.status!=='done' && dlBtn){
      dlBtn.remove();
    }
    // Disable convert btn while converting
    const convertBtn = actions.querySelector('.btn-ghost');
    if(convertBtn) convertBtn.disabled = f.status==='converting';
  }

  // Badge
  const badge = card.querySelector(`#badge-${f.id}`);
  if(badge) badge.textContent = ext(f.file.name).toUpperCase() + ' → ' + f.target.toUpperCase();
}

function statusMeta(s){
  if(s==='done')       return { pillClass:'pill-done',       pillLabel:'Done' };
  if(s==='error')      return { pillClass:'pill-error',      pillLabel:'Error' };
  if(s==='converting') return { pillClass:'pill-converting', pillLabel:'Converting' };
  return                      { pillClass:'pill-ready',      pillLabel:'Ready' };
}

function escHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

   CONTROLS
══════════════════════════════════════════════════════════════ */
function setFormat(id, val){
  const f = files.find(x=>x.id===id);
  if(!f) return;
  f.target = val;
  f.status = 'ready';
  f.result = null;
  render();
}

function setQuality(id, val){
  const f = files.find(x=>x.id===id);
  if(!f) return;
  f.quality = parseFloat(val);
  const lbl = document.getElementById('qval-'+id);
  if(lbl) lbl.textContent = Math.round(f.quality*100) + '%';
}

function removeFile(id){
  const f = files.find(x=>x.id===id);
  if(f && f.thumbUrl) URL.revokeObjectURL(f.thumbUrl);
  files = files.filter(f=>f.id !== id);
  render();
}

// Image → image blob
function convertImage(file, type, quality){
  return new Promise((res, rej)=>{
    const img    = new Image();
    const canvas = document.createElement('canvas');
    const ctx    = canvas.getContext('2d');
    const objUrl = URL.createObjectURL(file);

    img.onerror = ()=>{ URL.revokeObjectURL(objUrl); rej(new Error('Image load failed')); };
    img.onload  = ()=>{
      canvas.width  = img.naturalWidth;
      canvas.height = img.naturalHeight;
      ctx.drawImage(img, 0, 0);
      URL.revokeObjectURL(objUrl);

      // PNG is lossless — no quality param; for PDF target produce JPEG
      const mimeType = (type==='pdf'||type==='jpg') ? 'image/jpeg'
                     : type==='webp' ? 'image/webp'
                     : 'image/png';
      const q = mimeType==='image/png' ? undefined : quality;
      canvas.toBlob(blob=>{ blob ? res(blob) : rej(new Error('toBlob returned null')); }, mimeType, q);
    };
    img.src = objUrl;
  });
}

// Image blob → PDF blob (aspect-ratio aware)
async function imageToPDF(blob){
  const { jsPDF } = window.jspdf;
  const url = URL.createObjectURL(blob);

  const img = await new Promise((res, rej)=>{
    const i = new Image();
    i.onload  = ()=> res(i);
    i.onerror = ()=> rej(new Error('Image load failed for PDF'));
    i.src = url;
  });

  const wPx = img.naturalWidth, hPx = img.naturalHeight;
  const landscape = wPx > hPx;
  const pdf = new jsPDF({ orientation: landscape ? 'l' : 'p', unit: 'mm', format: 'a4' });

  const pageW = landscape ? 297 : 210;
  const pageH = landscape ? 210 : 297;
  const margin = 10;
  const maxW = pageW - margin*2;
  const maxH = pageH - margin*2;

  const ratio = hPx / wPx;
  let drawW = maxW, drawH = maxW * ratio;
  if(drawH > maxH){ drawH = maxH; drawW = maxH / ratio; }

  const x = margin + (maxW - drawW) / 2;
  const fmt = blob.type==='image/png' ? 'PNG' : 'JPEG';
  pdf.addImage(url, fmt, x, margin, drawW, drawH);
  URL.revokeObjectURL(url);
  return pdf.output('blob');
}

// DOCX → PDF — renders header (logo + title) from header1.xml, then body via mammoth HTML
async function docxToPDF(file){
  // ── 1. Crack open the DOCX zip to pull header image + text ──────────────
  const arrayBuffer = await file.arrayBuffer();

  // JSZip is already loaded globally
  const zip = await JSZip.loadAsync(arrayBuffer);

  // Helper: read a zip entry as text
  async function zipText(path){
    const entry = zip.file(path);
    return entry ? entry.async('string') : null;
  }
  // Helper: read a zip entry as base64
  async function zipBase64(path){
    const entry = zip.file(path);
    return entry ? entry.async('base64') : null;
  }

  // Parse header XML to get: logo image relationship ID + title text
  let logoDataUrl  = null;
  let logoW_mm     = 0;
  let logoH_mm     = 0;
  let headerTexts  = [];

  const hdrXml  = await zipText('word/header1.xml');
  const hdrRels = await zipText('word/_rels/header1.xml.rels');

  if(hdrXml){
    const hParser = new DOMParser();
    const hDoc    = hParser.parseFromString(hdrXml, 'application/xml');

    // Find all <wp:docPr> elements that have a name or descr containing "logo" (case-insensitive)
    // OR just grab the first inline image regardless — it's always the logo
    const inlines = hDoc.querySelectorAll('inline, anchor');
    if(inlines.length && hdrRels){
      const rParser = new DOMParser();
      const rDoc    = rParser.parseFromString(hdrRels, 'application/xml');

      for(const inline of inlines){
        // Get extent in EMU (1 inch = 914400 EMU, 1 mm = 914400/25.4 EMU)
        const ext = inline.querySelector('extent');
        if(ext){
          const cx = parseInt(ext.getAttribute('cx') || '0');
          const cy = parseInt(ext.getAttribute('cy') || '0');
          logoW_mm = cx / 914400 * 25.4;
          logoH_mm = cy / 914400 * 25.4;
        }

        // Find the blip embed relationship ID
        const blip = inline.querySelector('blip');
        const rEmbed = blip ? (blip.getAttribute('r:embed') || blip.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','embed')) : null;

        if(rEmbed){
          // Look up target in rels
          const rel = rDoc.querySelector(`Relationship[Id="${rEmbed}"]`);
          if(rel){
            const target = rel.getAttribute('Target');
            const imgPath = 'word/' + target.replace(/^\//, '');
            const b64 = await zipBase64(imgPath);
            if(b64){
              // Detect MIME from extension
              const mime = imgPath.endsWith('.png') ? 'image/png'
                         : imgPath.endsWith('.jpg')||imgPath.endsWith('.jpeg') ? 'image/jpeg'
                         : 'image/png';
              logoDataUrl = `data:${mime};base64,${b64}`;
              break;
            }
          }
        }
      }
    }

    // Extract text from header cells that don't contain images
    // Find all <w:t> text nodes whose parent <w:tc> has no <w:drawing>
    const tcs = hDoc.querySelectorAll('tc');
    tcs.forEach(tc=>{
      if(!tc.querySelector('drawing')){
        const t = [...tc.querySelectorAll('t')].map(n=>n.textContent).join('').trim();
        if(t) headerTexts.push(t);
      }
    });
  }

  // ── 2. Convert body via mammoth ──────────────────────────────────────────
  const mammothResult = await mammoth.convertToHtml({ arrayBuffer });
  const parser = new DOMParser();
  const doc    = parser.parseFromString(mammothResult.value, 'text/html');

  // ── 3. Set up jsPDF ─────────────────────────────────────────────────────
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit: 'mm', format: 'a4' });

  const ML = 15, MR = 15, MT = 14, MB = 15;
  const pageW = 210, pageH = 297;
  const maxW  = pageW - ML - MR;

  let y = MT;

  function checkPage(needed){
    if(y + needed > pageH - MB){ pdf.addPage(); y = MT; }
  }

  // ── 4. Render header ────────────────────────────────────────────────────
  const HEADER_H = 14; // total header band height in mm

  // Draw a light-gray header band across the top
  pdf.setFillColor(245, 245, 245);
  pdf.rect(0, 0, pageW, HEADER_H + 2, 'F');
  pdf.setDrawColor(220, 220, 220);
  pdf.line(0, HEADER_H + 2, pageW, HEADER_H + 2);

  if(logoDataUrl){
    // Clamp logo to fit header band
    const maxLogoW = 55;
    const maxLogoH = HEADER_H - 2;
    let drawW = Math.min(logoW_mm || maxLogoW, maxLogoW);
    let drawH = logoH_mm && logoW_mm ? drawW * (logoH_mm / logoW_mm) : maxLogoH;
    if(drawH > maxLogoH){ drawH = maxLogoH; drawW = logoW_mm ? drawH * (logoW_mm / logoH_mm) : drawW; }
    const logoY = (HEADER_H + 2 - drawH) / 2;
    const fmt   = logoDataUrl.startsWith('data:image/png') ? 'PNG' : 'JPEG';
    pdf.addImage(logoDataUrl, fmt, ML, logoY, drawW, drawH);
  }

  // Render header title text right-aligned
  if(headerTexts.length){
    const title = headerTexts.join(' ').trim();
    pdf.setFont('helvetica', 'bold');
    pdf.setFontSize(9);
    pdf.setTextColor(60, 60, 60);
    const titleW = pdf.getTextWidth(title);
    pdf.text(title, pageW - MR - titleW, HEADER_H / 2 + 1.5);
    pdf.setTextColor(0, 0, 0);
  }

  y = HEADER_H + 7; // start body content below header band

  // ── 5. Helpers ───────────────────────────────────────────────────────────

  function getRuns(el){
    const runs = [];
    el.childNodes.forEach(node=>{
      if(node.nodeType === Node.TEXT_NODE){
        if(node.textContent) runs.push({ text: node.textContent, bold: false, italic: false });
      } else if(node.nodeType === Node.ELEMENT_NODE){
        const tag    = node.tagName.toLowerCase();
        const bold   = ['strong','b'].includes(tag);
        const italic = ['em','i'].includes(tag);
        node.childNodes.forEach(child=>{
          if(child.nodeType === Node.TEXT_NODE && child.textContent)
            runs.push({ text: child.textContent, bold, italic });
        });
      }
    });
    return runs;
  }

  function renderRuns(runs, fontSize, lineH, indent){
    indent = indent || 0;
    pdf.setFontSize(fontSize);
    const usableW = maxW - indent;
    const words = [];
    runs.forEach(run=>{
      run.text.split(/(\s+)/).forEach(seg=>{
        if(seg) words.push({ w: seg, bold: run.bold, italic: run.italic });
      });
    });
    const lines2 = [];
    let cur = [], curW = 0;
    words.forEach(wObj=>{
      pdf.setFont('helvetica', wObj.bold ? 'bold' : (wObj.italic ? 'italic' : 'normal'));
      const ww = pdf.getTextWidth(wObj.w);
      if(curW + ww > usableW && cur.length && wObj.w.trim()){
        lines2.push(cur); cur = [wObj]; curW = ww;
      } else {
        cur.push(wObj); curW += ww;
      }
    });
    if(cur.length) lines2.push(cur);
    lines2.forEach(line=>{
      checkPage(lineH);
      let x = ML + indent;
      line.forEach(wObj=>{
        if(!wObj.w.trim() && x === ML + indent) return;
        pdf.setFont('helvetica', wObj.bold ? 'bold' : (wObj.italic ? 'italic' : 'normal'));
        pdf.text(wObj.w, x, y);
        x += pdf.getTextWidth(wObj.w);
      });
      y += lineH;
    });
  }

  // Render a table with proper per-cell text wrapping
  function renderTable(tableEl){
    const rows = [...tableEl.querySelectorAll('tr')];
    if(!rows.length) return;

    // Determine column widths — equal split
    const maxCols = Math.max(...rows.map(r => r.children.length), 1);
    const colW    = maxW / maxCols;
    const cellPad = 2;
    const fontSize = 9;
    const lineH    = 4.5;

    pdf.setFontSize(fontSize);

    rows.forEach((row, ri)=>{
      const cells = [...row.children];
      const isHeader = ri === 0 || row.querySelector('th') !== null;

      // Pre-calculate row height by wrapping each cell's text
      let rowH = lineH + cellPad * 2;
      cells.forEach(cell=>{
        const cellW    = colW * (parseInt(cell.getAttribute('colspan') || '1'));
        const wrapped  = pdf.splitTextToSize(cell.textContent.trim(), cellW - cellPad * 2);
        const cellH    = wrapped.length * lineH + cellPad * 2;
        rowH = Math.max(rowH, cellH);
      });

      checkPage(rowH);

      // Draw cells
      cells.forEach((cell, ci)=>{
        const colspan = parseInt(cell.getAttribute('colspan') || '1');
        const cellW   = colW * colspan;
        const x       = ML + ci * colW;

        // Fill
        pdf.setFillColor(isHeader ? 230 : (ri % 2 === 0 ? 250 : 255),
                         isHeader ? 230 : (ri % 2 === 0 ? 250 : 255),
                         isHeader ? 235 : 255);
        pdf.setDrawColor(180, 180, 180);
        pdf.rect(x, y - lineH, cellW, rowH, 'FD');

        // Text
        pdf.setFont('helvetica', isHeader ? 'bold' : 'normal');
        const cellText = cell.textContent.trim();
        const wrapped  = pdf.splitTextToSize(cellText, cellW - cellPad * 2);
        wrapped.forEach((line, li)=>{
          pdf.text(line, x + cellPad, y - lineH + cellPad + lineH * li + lineH * 0.7);
        });
      });

      y += rowH;
    });
    y += 3;
  }

  // ── 6. Render body ───────────────────────────────────────────────────────
  for(const el of doc.body.children){
    const tag = el.tagName.toLowerCase();

    if(['h1','h2','h3','h4','h5','h6'].includes(tag)){
      const level = parseInt(tag[1]);
      const sizes = [18, 15, 13, 12, 11, 10.5];
      const fs    = sizes[level - 1] || 11;
      const lh    = fs * 0.43;
      y += level <= 2 ? 5 : 3;
      checkPage(lh + 4);
      pdf.setFont('helvetica','bold');
      pdf.setFontSize(fs);
      const wrapped = pdf.splitTextToSize(el.textContent.trim(), maxW);
      wrapped.forEach(line=>{ checkPage(lh); pdf.text(line, ML, y); y += lh; });
      y += level <= 2 ? 3 : 2;
    }

    else if(tag === 'p'){
      const runs = getRuns(el);
      if(!runs.some(r => r.text.trim())){ y += 2; continue; }
      renderRuns(runs, 10.5, 5.5, 0);
      y += 1.5;
    }

    else if(['ul','ol'].includes(tag)){
      let idx = 1;
      el.querySelectorAll('li').forEach(li=>{
        const bullet = tag === 'ol' ? (idx++ + '.') : '\u2022';
        checkPage(5.5);
        pdf.setFont('helvetica','normal');
        pdf.setFontSize(10.5);
        pdf.text(bullet, ML, y);
        const runs = getRuns(li);
        if(runs.some(r=>r.text.trim())) renderRuns(runs, 10.5, 5.5, 6);
        else y += 5.5;
      });
      y += 2;
    }

    else if(tag === 'table'){
      renderTable(el);
    }

    else {
      const text = el.textContent.trim();
      if(!text){ y += 2; continue; }
      pdf.setFont('helvetica','normal');
      pdf.setFontSize(10.5);
      const wrapped = pdf.splitTextToSize(text, maxW);
      wrapped.forEach(line=>{ checkPage(5.5); pdf.text(line, ML, y); y += 5.5; });
      y += 2;
    }
  }

  return pdf.output('blob');
}

// PDF → DOCX: extract text with layout awareness via Y-position grouping
async function pdfToDocx(file){
  if(!window.pdfjsLib){
    await new Promise((res, rej)=>{
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
      s.onload = res; s.onerror = rej;
      document.head.appendChild(s);
    });
    window.pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }

  const arrayBuffer = await file.arrayBuffer();
  const pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

  // ── Extract text grouped into lines, then paragraphs ──────────────────────
  const allPageParagraphs = []; // array of paragraph strings

  for(let p = 1; p <= pdfDoc.numPages; p++){
    const page    = await pdfDoc.getPage(p);
    const content = await page.getTextContent({ normalizeWhitespace: true });

    if(!content.items.length) continue;

    // Each item has: str, transform=[a,b,c,d,x,y], height
    // Group items into lines by rounding Y to nearest ~1.5pt bucket
    const lineMap = new Map(); // roundedY → [{str, x}]

    content.items.forEach(item=>{
      if(!item.str.trim()) return;
      const y = Math.round(item.transform[5] / 1.5) * 1.5; // bucket by ~1.5pt
      const x = item.transform[4];
      if(!lineMap.has(y)) lineMap.set(y, []);
      lineMap.get(y).push({ str: item.str, x });
    });

    // Sort lines top-to-bottom (PDF Y is bottom-up, so descending)
    const sortedYs = [...lineMap.keys()].sort((a,b)=> b - a);

    // Assemble line strings (sorted left-to-right within line)
    const lineStrings = sortedYs.map(y=>{
      const items2 = lineMap.get(y).sort((a,b)=> a.x - b.x);
      return items2.map(i=> i.str).join(' ').replace(/\s{2,}/g,' ').trim();
    }).filter(Boolean);

    // Group consecutive lines into paragraphs:
    // A new paragraph starts when:
    //   (a) Y gap between lines is > ~1.8× normal line height, or
    //   (b) line ends with sentence-ending punctuation
    const lineGaps = [];
    for(let i=1; i<sortedYs.length; i++)
      lineGaps.push(sortedYs[i-1] - sortedYs[i]); // positive because descending

    const medianGap = lineGaps.length
      ? [...lineGaps].sort((a,b)=>a-b)[Math.floor(lineGaps.length/2)]
      : 12;

    let currentPara = [];
    lineStrings.forEach((line, i)=>{
      currentPara.push(line);
      const gap   = lineGaps[i] || 0;
      const newPara = gap > medianGap * 1.6 || /[.!?]$/.test(line);
      if(newPara){
        allPageParagraphs.push(currentPara.join(' '));
        currentPara = [];
      }
    });
    if(currentPara.length) allPageParagraphs.push(currentPara.join(' '));

    // Page break marker
    if(p < pdfDoc.numPages) allPageParagraphs.push('__PAGEBREAK__');
  }

  // ── Build OOXML .docx ─────────────────────────────────────────────────────
  const esc = s => s
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\u2018|\u2019/g,"'").replace(/\u201C|\u201D/g,'"');

  // Heuristic: first non-empty paragraph of a page with large font → heading
  // We'll just use <w:p> with heading style for lines that are ALL CAPS or very short (<60 chars) at start of page
  function makeParagraph(text, isPageBreakBefore){
    const isHeading = text.length < 80 && text === text.toUpperCase() && text.length > 3;
    const styleId   = isHeading ? 'Heading1' : 'Normal';
    const pb = isPageBreakBefore
      ? `<w:pPr><w:pageBreakBefore/></w:pPr>` : '';
    return `<w:p>
      <w:pPr><w:pStyle w:val="${styleId}"/>${isPageBreakBefore?'<w:pageBreakBefore/>':''}</w:pPr>
      <w:r><w:rPr>${isHeading?'<w:b/>':''}</w:rPr>
        <w:t xml:space="preserve">${esc(text)}</w:t>
      </w:r>
    </w:p>`;
  }

  let pageBreakNext = false;
  const paragraphsXml = allPageParagraphs.map(text=>{
    if(text === '__PAGEBREAK__'){ pageBreakNext = true; return ''; }
    const pb = pageBreakNext;
    pageBreakNext = false;
    return makeParagraph(text, pb);
  }).filter(Boolean).join('\n');

  const zip = new JSZip();

  zip.file('[Content_Types].xml',
`<?xml version="1.0" encoding="UTF-8"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml"  ContentType="application/xml"/>
  <Override PartName="/word/document.xml"
    ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
  <Override PartName="/word/styles.xml"
    ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>
</Types>`);

  zip.folder('_rels').file('.rels',
`<?xml version="1.0" encoding="UTF-8"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1"
    Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument"
    Target="word/document.xml"/>
</Relationships>`);

  zip.folder('word').folder('_rels').file('document.xml.rels',
`<?xml version="1.0" encoding="UTF-8"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1"
    Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles"
    Target="styles.xml"/>
</Relationships>`);

  // Styles: Normal + Heading1
  zip.folder('word').file('styles.xml',
`<?xml version="1.0" encoding="UTF-8"?>
<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:style w:type="paragraph" w:styleId="Normal">
    <w:name w:val="Normal"/>
    <w:rPr><w:sz w:val="22"/><w:szCs w:val="22"/></w:rPr>
    <w:pPr><w:spacing w:after="120"/></w:pPr>
  </w:style>
  <w:style w:type="paragraph" w:styleId="Heading1">
    <w:name w:val="heading 1"/>
    <w:basedOn w:val="Normal"/>
    <w:rPr><w:b/><w:sz w:val="32"/><w:szCs w:val="32"/></w:rPr>
    <w:pPr><w:spacing w:before="240" w:after="120"/></w:pPr>
  </w:style>
</w:styles>`);

  zip.folder('word').file('document.xml',
`<?xml version="1.0" encoding="UTF-8"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:body>
${paragraphsXml}
    <w:sectPr>
      <w:pgSz w:w="12240" w:h="15840"/>
      <w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440"/>
    </w:sectPr>
  </w:body>
</w:document>`);

  return zip.generateAsync({
    type: 'blob',
    mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
  });
}

// Any file → Base64 text blob
async function toBase64(file){
  const buf   = await file.arrayBuffer();
  const bytes = new Uint8Array(buf);
  let binary  = '';
  const chunk = 8192;
  for(let i=0; i<bytes.length; i+=chunk)
    binary += String.fromCharCode(...bytes.subarray(i, i+chunk));
  return new Blob([btoa(binary)], { type: 'text/plain' });
}

/* ══════════════════════════════════════════════════════════════
   CONVERT ONE
══════════════════════════════════════════════════════════════ */
async function convertOne(fid){
  const f = files.find(x=>x.id===fid);
  if(!f || f.status==='converting') return;

  f.status = 'converting';
  render();

  try{
    const e = ext(f.file.name);
    let result;

    if(imgTypes.includes(e)){
      if(f.target==='base64'){
        // BUG FIX: don't wastefully convertImage before base64-encoding
        result = await toBase64(f.file);
      } else {
        const imgBlob = await convertImage(f.file, f.target, f.quality);
        result = f.target==='pdf' ? await imageToPDF(imgBlob) : imgBlob;
      }
    }
    else if(e==='docx' && f.target==='pdf')  { result = await docxToPDF(f.file); }
    else if(e==='pdf'  && f.target==='docx') { result = await pdfToDocx(f.file); }
    else if(f.target==='base64')             { result = await toBase64(f.file); }
    else                                     { result = f.file; }

    f.result = result;
    f.status = 'done';
    showToast('✓ ' + f.file.name + ' converted');
  } catch(err){
    console.error(err);
    f.status = 'error';
    showToast('✗ Failed: ' + f.file.name);
  }

  render();
}

/* ══════════════════════════════════════════════════════════════
   CONVERT ALL
══════════════════════════════════════════════════════════════ */
async function convertAll(){
  const pending = files.filter(f=> f.status !== 'done');
  if(!pending.length){ showToast('Nothing new to convert'); return; }
  for(const f of pending) await convertOne(f.id);
  showToast('✓ All conversions complete');
}

/* ══════════════════════════════════════════════════════════════
   DOWNLOAD
══════════════════════════════════════════════════════════════ */
function downloadOne(id){
  const f = files.find(x=>x.id===id);
  if(!f || !f.result) return;
  const baseName = f.file.name.replace(/\.[^.]+$/,'');
  const ext2     = f.target==='base64' ? 'txt' : f.target;
  const url      = URL.createObjectURL(f.result);
  const a        = document.createElement('a');
  a.href = url; a.download = baseName + '_converted.' + ext2;
  a.click();
  setTimeout(()=> URL.revokeObjectURL(url), 1000);
}

async function downloadAll(){
  const done = files.filter(f=> f.status==='done');
  if(!done.length){ showToast('No converted files to download'); return; }
  const zip = new JSZip();
  done.forEach((f,i)=>{
    const baseName = f.file.name.replace(/\.[^.]+$/,'');
    const ext2     = f.target==='base64' ? 'txt' : f.target;
    zip.file(baseName + '_' + i + '.' + ext2, f.result);
  });
  const blob = await zip.generateAsync({ type:'blob' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = 'convertflow_export.zip';
  a.click();
  setTimeout(()=> URL.revokeObjectURL(url), 1000);
  showToast('✓ ZIP downloaded');
}
